openapi: 3.0.0
info:
  description: This is the API for the EODHP Workspace Services.
  title: EODHP Workspace Services API
  contact: {}
  version: v1
paths:
  /accounts:
    get:
      description: Retrieve a list of billing accounts owned by the authenticated user.
      tags:
        - Billing and Billing Accounts
      summary: Get billing accounts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/models.Account"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  "/accounts/{id}":
    get:
      description: Retrieve details of a specific billing account by its unique ID.
      tags:
        - Billing and Billing Accounts
      summary: Get a billing account
      parameters:
        - description: Account ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.Account"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  /workspaces:
    get:
      description: Retrieve a list of workspaces for the authenticated user.
      tags:
        - Workspace Management
      summary: Get a list of workspaces you are a member of
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/models.WorkspaceSettings"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  "/workspaces/{workspace-id}":
    get:
      description: Retrieve a specific workspace using its ID for the authenticated user.
      tags:
        - Workspace Management
      summary: Get a workspace by ID
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.WorkspaceSettings"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  "/workspaces/{workspace-id}/admins":
    get:
      description: Retrieve the usernames of every explicitly-granted admin on the
        specified workspace. Does not include the account owner, who is an
        implicit admin on every workspace they own.
      tags:
        - Workspace Management
      summary: Get the admins of a workspace
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  "/workspaces/{workspace-id}/admins/{username}":
    put:
      description: Grant an existing workspace member admin status by providing the
        workspace ID and username. The user must already be a member of the
        workspace.
      tags:
        - Workspace Management
      summary: Grant a user admin status on a workspace
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
        - description: Username
          name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
    delete:
      description: Revoke a user's admin status on the specified workspace by
        providing the workspace ID and username.
      tags:
        - Workspace Management
      summary: Revoke a user's admin status on a workspace
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
        - description: Username
          name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  "/workspaces/{workspace-id}/files":
    get:
      security:
        - BearerAuth: []
      description: List files for object and/or block stores in a workspace.
      tags:
        - Workspace Files Management
      summary: List files in a workspace
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
        - description: "Store type: object or block"
          name: store
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.FileListResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  "/workspaces/{workspace-id}/files/block":
    post:
      security:
        - BearerAuth: []
      description: Upload files to the workspace block store.
      tags:
        - Workspace Files Management
      summary: Upload files to the workspace block store
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/postWorkspaces_workspaceId_filesBlock"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.FileUploadResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
    delete:
      security:
        - BearerAuth: []
      description: Delete a file from the workspace block store.
      tags:
        - Workspace Files Management
      summary: Delete a file from the workspace block store
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
        - description: File name to delete
          name: file
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.FileDeleteResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.FileDeleteResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  "/workspaces/{workspace-id}/files/block/metadata":
    get:
      security:
        - BearerAuth: []
      description: Get metadata for a single file in the workspace block store.
      tags:
        - Workspace Files Management
      summary: Get block store file metadata
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
        - description: File name within the workspace
          name: file
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.FileMetadataResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  "/workspaces/{workspace-id}/files/object":
    post:
      security:
        - BearerAuth: []
      description: Upload files to the workspace object store.
      tags:
        - Workspace Files Management
      summary: Upload files to the workspace object store
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/postWorkspaces_workspaceId_filesBlock"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.FileUploadResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
    delete:
      security:
        - BearerAuth: []
      description: Delete a file from the workspace object store.
      tags:
        - Workspace Files Management
      summary: Delete a file from the workspace object store
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
        - description: File name to delete
          name: file
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.FileDeleteResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.FileDeleteResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  "/workspaces/{workspace-id}/files/object/metadata":
    get:
      security:
        - BearerAuth: []
      description: Get metadata for a single file in the workspace object store.
      tags:
        - Workspace Files Management
      summary: Get object store file metadata
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
        - description: File name within the workspace
          name: file
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.FileMetadataResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  "/workspaces/{workspace-id}/files/object/upload-url":
    get:
      security:
        - BearerAuth: []
      description: Returns a presigned S3 PutObject URL. The client uploads the file
        directly to S3 using the returned URL, bypassing this service entirely
        for the data transfer.
      tags:
        - Workspace Files Management
      summary: Get a presigned upload URL for the workspace object store
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
        - description: File path within the workspace
          name: file
          in: query
          required: true
          schema:
            type: string
        - description: File size in bytes
          name: size
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.FileUploadURLResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  "/workspaces/{workspace-id}/open-cosmos/session":
    get:
      security:
        - BearerAuth: []
      description: Reports whether an Open Cosmos OAuth session is currently stored
        for the workspace.
      tags:
        - Linked Accounts
      summary: Get the Open Cosmos OAuth session status
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/services.OpenCosmosSessionStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
    post:
      security:
        - BearerAuth: []
      description: Creates or replaces the Open Cosmos OAuth session shared by the
        workspace in its Kubernetes namespace.
      tags:
        - Linked Accounts
      summary: Store an Open Cosmos OAuth session
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/services.OpenCosmosSessionPayload"
        description: Open Cosmos OAuth session
        required: true
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
    delete:
      security:
        - BearerAuth: []
      description: Revokes the Open Cosmos OAuth session stored for the workspace's
        Kubernetes namespace.
      tags:
        - Linked Accounts
      summary: Delete the Open Cosmos OAuth session
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            "*/*":
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            "*/*":
              schema:
                type: string
  "/workspaces/{workspace-id}/users":
    get:
      description: Retrieve a list of users who are members of the specified workspace.
      tags:
        - Workspace Management
      summary: Get users of a workspace
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/models.User"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  "/workspaces/{workspace-id}/users/{username}":
    get:
      description: Retrieve details of a specific user that is a member of the
        specified workspace.
      tags:
        - Workspace Management
      summary: Get a user of a workspace
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
        - description: Username
          name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.User"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
    put:
      description: Add a user to the specified workspace by providing the workspace ID
        and username.
      tags:
        - Workspace Management
      summary: Add a user to a workspace
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
        - description: Username
          name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
    delete:
      description: Remove a user from the specified workspace by providing the
        workspace ID and username.
      tags:
        - Workspace Management
      summary: Remove a user from a workspace
      parameters:
        - description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
        - description: Username
          name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  "/workspaces/{workspace-id}/{user-id}/s3-tokens":
    post:
      description: Request S3 session credentials for user access to a single
        workspace. {user-id} can be set to "me" to use the token owner's user
        id.
      tags:
        - Workspace Management
      summary: Request S3 session credentials
      parameters:
        - example: my-workspace
          description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
        - example: me
          description: User ID
          name: user-id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/awsclient.S3Credentials"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  "/workspaces/{workspace-id}/{user-id}/sessions":
    post:
      description: Request workspace scoped session credentials for user access to a
        single workspace. {user-id} can be set to "me" to use the token owner's
        user id.
      tags:
        - Workspace Management
      summary: Request workspace scoped session credentials
      parameters:
        - example: my-workspace
          description: Workspace ID
          name: workspace-id
          in: path
          required: true
          schema:
            type: string
        - example: me
          description: User ID
          name: user-id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/handlers.AuthSessionResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
components:
  requestBodies:
    postWorkspaces_workspaceId_filesBlock:
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
